name: Generate Snake
on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: gely25
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f472b6&color_dots=%23ede9fe,%23d8ccfb,%23c4b5fd,%23a78bfa,%237c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f9a8d4&color_dots=%231f1b3d,%234c3b8f,%236d58c9,%239b87f5,%23c4b5fd
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
